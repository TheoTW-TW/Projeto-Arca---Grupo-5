<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Veterinário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="teste.css">
</head>

<body>
    <header>
        <div class="head_superior">
            <div class="tools_1">
                <div class="perfil_wrapper">
                    <i class="fa-regular fa-circle-user" id="perfil_btn" onclick="togglePerfil()"></i>
                    <div class="perfil_dropdown" id="perfil_dropdown">
                        <button class="entrar">ENTRAR</button>
                        <button class="entrar">CADASTRAR</button>
                    </div>
                </div>
            </div>
            <div class="titulo">
                <h1>TITULO</h1>
            </div>
            <div class="tools_2">
                <a href="#">
                    <i class="fa-regular fa-circle-question"></i>
                </a>
                <button class="entrar">SOBRE</button>
                <a href="#">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>

        <div class="head_nav">
            <nav>
                <div class="nav__content">
                    <input type="checkbox" id="menu" class="sr-only">
                    <div class="nav__control">
                        <label for="menu" aria-label="Abrir menu">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                            </svg>
                        </label>
                    </div>
                    <div class="nav__options">
                        <a class="link" href="#">
                            <span>Adoção</span>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </a>
                        <a class="link" href="#">
                            <span>Atendimento Veterinário</span>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </a>
                        <a class="link" href="#">
                            <span>Acompanhar Solicitações</span>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </a>
                        <a class="link ebook" href="#">
                            <span>Denuncie!</span>
                            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <div class="titulo_soli">
        <div class="seta">
            <a href="#">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
        <div class="titulo_pag">
            <h3>Atendimento Veterinário</h3>
        </div>
    </div>

    <div class="container_atendimento">
        <div class="form_atendimento">

            <div class="linha_dupla">
                <div class="campo">
                    <label for="nome_animal">Nome do animal:</label>
                    <input type="text" id="nome_animal" name="nome_animal">
                </div>
                <div class="campo">
                    <label for="especie">Espécie:</label>
                    <input type="text" id="especie" name="especie">
                </div>
            </div>

            <div class="linha_dupla">
                <div class="campo">
                    <label for="raca">Raça:</label>
                    <input type="text" id="raca" name="raca">
                </div>
                <div class="campo">
                    <label for="idade">Idade:</label>
                    <input type="text" id="idade" name="idade">
                </div>
            </div>

            <div class="campo_saude">
                <label>Ele possui algum problema de saúde?</label>
                <div class="caixa_opcoes">
                    <div class="opcoes_saude">
                        <label><input type="checkbox" name="saude" value="sim"> Sim</label>
                        <label><input type="checkbox" name="saude" value="nao"> Não</label>
                    </div>
                </div>
            </div>

            <div class="campo_detalhes">
                <label for="mais_detalhes">Mais detalhes</label>
                <input type="text" id="mais_detalhes" name="mais_detalhes">
            </div>

            <div class="campo_atendimento">
                <label>Qual atendimento o seu pet está precisando?</label>
                <div class="caixa_opcoes">
                    <div class="opcoes_atendimento">
                        <label><input type="checkbox" name="atendimento" value="vacinacao"> Vacinação</label>
                        <label><input type="checkbox" name="atendimento" value="castracao"> Castração</label>
                        <label><input type="checkbox" name="atendimento" value="consulta"> Consulta Veterinária</label>
                    </div>
                </div>
            </div>

            <div class="btn_saiba">
                <button>Saiba mais sobre os atendimentos</button>
            </div>

        </div>
    </div>

    <script>
        function togglePerfil() {
            var d = document.getElementById('perfil_dropdown');
            d.classList.toggle('aberto');
        }

        document.addEventListener('click', function(e) {
            var wrapper = document.querySelector('.perfil_wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('perfil_dropdown').classList.remove('aberto');
            }
        });
    </script>

</body>
</html>
